name: pydaglogo Validation

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/pydaglogo-validation.yml"
  push:
    paths:
      - "**"
      - ".github/workflows/pydaglogo-validation.yml"
  workflow_dispatch:

jobs:
  public-exact-parity:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R for exact Fisher validation
        shell: pwsh
        run: |
          # Some repositories only allow GitHub-authored actions.
          # Installing R via Chocolatey keeps the workflow runnable there.
          choco install r.project -y --no-progress

      - name: Install pydaglogo and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Resolve Rscript path for exact Fisher validation
        shell: pwsh
        run: |
          $candidates = [System.Collections.Generic.List[string]]::new()

          $command = Get-Command Rscript -ErrorAction SilentlyContinue
          if ($command) {
            $candidates.Add($command.Source)
          }

          foreach ($root in @("C:\\Program Files\\R", "C:\\ProgramData\\chocolatey\\lib")) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Filter Rscript.exe -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object { $candidates.Add($_.FullName) }
            }
          }

          $rscript = $candidates | Select-Object -Unique | Select-Object -First 1
          if (-not $rscript) {
            throw "Rscript was not found on PATH after installation."
          }
          "PYDAGLOGO_FISHER_BACKEND=r" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYDAGLOGO_RSCRIPT=$rscript" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run public validation pytest suite
        shell: pwsh
        run: |
          python -m pytest -p no:cacheprovider --basetemp "${{ runner.temp }}/pytest-pydaglogo"
