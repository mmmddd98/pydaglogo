[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydaglogo"
version = "1.0.0"
description = "A Python reimplementation of core dagLogo-style differential amino-acid usage statistics."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Markus Kramer" }
]
keywords = [
  "bioinformatics",
  "proteomics",
  "sequence logo",
  "amino acid",
  "dagLogo",
  "differential analysis",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
  "Development Status :: 5 - Production/Stable",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.10",
  "matplotlib>=3.6",
  "logomaker>=0.8",
]

[project.urls]
Homepage = "https://github.com/mmmddd98/pydaglogo"
Repository = "https://github.com/mmmddd98/pydaglogo"
"Bug Tracker" = "https://github.com/mmmddd98/pydaglogo/issues"

[project.optional-dependencies]
dev = ["pytest"]
docs = ["sphinx>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
